version: "3.8"
services:
  hadoop:
    image: asami76/hadoop-pseudo:v1.0
    container_name: hadoopc
    hostname: hadoopc
    restart: unless-stopped
    command: bash -c "/usr/local/bootstrap.sh; tail -f /dev/null"
    ports:
      - "9870:9870"    # HDFS NameNode Web UI  → http://localhost:9870
      - "9864:9864"    # HDFS DataNode Web UI  → http://localhost:9864
      - "8088:8088"    # YARN ResourceManager  → http://localhost:8088
      - "8042:8042"    # YARN NodeManager      → http://localhost:8042
      - "19888:19888"  # MapReduce History     → http://localhost:19888
      - "9000:9000"    # HDFS NameNode RPC     → hadoopc:9000
    volumes:
      - ./data:/home/hadoop/data
    networks:
      etl-network:
        aliases:
          - hadoopc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

# SPARK
# MSSQL
# AIRFLOW 

# NETWORKS
networks:
  etl-network:
    driver: bridge
    name: etl-nyc-uber-network

# VOLUMES
volumes: {}
